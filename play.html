<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Game - VortXshadow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a1a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: #111827;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      z-index: 10;
    }
    .header a {
      color: #22d3ee;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
    .header a:hover {
      color: #67e8f9;
    }
    #game-title {
      font-weight: 500;
      color: #e5e7eb;
      font-size: 15px;
    }
    .game-container {
      flex: 1;
      position: relative;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0a0a1a;
      z-index: 5;
      gap: 12px;
    }
    .loading.hidden {
      display: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="./">← Back to VortXshadow</a>
    <span id="game-title">Loading...</span>
  </div>

  <div class="game-container">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Loading game...</div>
    </div>
    <iframe 
      id="game-frame"
      allowfullscreen
      allow="autoplay; fullscreen; gamepad; keyboard-map"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals"
    ></iframe>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const gameName = params.get("game") || "Unknown Game";

    document.getElementById("game-title").textContent = gameName;
    document.title = gameName + " - VortXshadow";

    // Create a search-friendly slug
    const slug = gameName
      .toLowerCase()
      .replace(/['']/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-|-$/g, "");

    // Try the most common CrazyGames game URL format
    const gameUrl = `https://www.crazygames.com/game/${slug}`;

    const iframe = document.getElementById("game-frame");
    const loading = document.getElementById("loading");

    iframe.src = gameUrl;

    iframe.onload = function() {
      // Hide loading after a short delay
      setTimeout(() => {
        loading.classList.add("hidden");
      }, 800);
    };

    // Fallback if iframe is blocked
    setTimeout(() => {
      if (!loading.classList.contains("hidden")) {
        loading.innerHTML = `
          <div style="text-align:center; max-width:400px; padding:20px;">
            <p style="margin-bottom:16px;">Game is loading...</p>
            <p style="font-size:14px; color:#9ca3af; margin-bottom:20px;">
              If the game doesn't appear, CrazyGames may be blocking the embed.
            </p>
            <a href="${gameUrl}" target="_blank" 
               style="background:#22d3ee; color:#000; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">
              Open Game
            </a>
          </div>
        `;
      }
    }, 6000);
  </script>
</body>
</html>
