<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Game - VortXshadow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0f1a;
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #111827;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #1f2937;
    }
    .header a {
      color: #22d3ee;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      text-align: center;
    }
    .game-name {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .subtitle {
      color: #9ca3af;
      font-size: 15px;
      margin-bottom: 40px;
    }
    .play-btn {
      background: linear-gradient(135deg, #22d3ee, #06b6d4);
      color: #000;
      border: none;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 8px 25px rgba(34, 211, 238, 0.3);
      transition: transform 0.2s;
    }
    .play-btn:active {
      transform: scale(0.96);
    }
    .note {
      margin-top: 30px;
      font-size: 13px;
      color: #6b7280;
      max-width: 280px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="./">← Back to VortXshadow</a>
  </div>

  <div class="content">
    <div class="game-name" id="game-title">Loading...</div>
    <div class="subtitle">Ready to play?</div>

    <a href="#" class="play-btn" id="play-btn" target="_blank" rel="noopener">
      ▶ Play Now
    </a>

    <div class="note">
      The game will open in a new tab. You can return here anytime.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const gameName = params.get("game") || "Unknown Game";

    document.getElementById("game-title").textContent = gameName;
    document.title = gameName + " - VortXshadow";

    // Create clean URL for CrazyGames
    const slug = gameName
      .toLowerCase()
      .replace(/['']/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-|-$/g, "");

    const gameUrl = `https://www.crazygames.com/game/${slug}`;

    document.getElementById("play-btn").href = gameUrl;
  </script>
</body>
</html>
